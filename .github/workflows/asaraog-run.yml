name: asaraog-run
on:
  workflow_dispatch:
    inputs:
      ref: {required: true}
      args: {required: true}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: "${{ inputs.ref }}"}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11"}
      - uses: astral-sh/setup-uv@v6
      - run: uvx tox run -e unit_tests -- -ra ${{ inputs.args }}
